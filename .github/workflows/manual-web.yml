# Website release pipeline. Computes the next version, builds the site, creates
# the tag and the GitHub Release, and attaches the web bundle.
# Versions are minted here only; "APK — Release" fills the release afterwards.
#
# Version scheme (.github/scripts/version.py): one dot 1.0 -> 1.1 -> ... -> 1.9
# -> 2.0. A two-dot override (e.g. 4.8.0) switches to X.Y.Z, minor and patch
# 0-9 (1.0.9 -> 1.1.0, 1.9.9 -> 2.0.0); a one-dot override switches back. The
# next version is one step after the release marked Latest, so an override
# (an ordinary tag + the Latest release) becomes the next run's baseline.
name: "Website — Release (Primary)"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override: 3 or 1.4 (one dot), or 1.4.0 to switch to two dots. Leave empty for the next automatic version."
        required: false
        default: ""
        type: string
      confirm:
        description: "Release from a non-default branch — required only when such a branch is selected"
        required: false
        default: false
        type: boolean

# Parallel runs would compute the same version and race for the same tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Website release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check branch
        env:
          CONFIRMED: ${{ inputs.confirm }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "Default branch selected: $GITHUB_REF_NAME"
            exit 0
          fi
          if [ "$CONFIRMED" != "true" ]; then
            echo "::error::$GITHUB_REF_NAME is not the default branch ($DEFAULT_BRANCH), and this workflow publishes a tag and a release. Re-run it with \"Release from a non-default branch\" enabled to continue, or use \"Website — Test Build\" for an artifact-only build."
            exit 1
          fi
          echo "::warning::Publishing a release from $GITHUB_REF_NAME. The default branch is $DEFAULT_BRANCH."

      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name' > /tmp/tags.txt || : > /tmp/tags.txt
          LATEST_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)
          # writes version= / tag= to $GITHUB_OUTPUT
          python3 .github/scripts/version.py next /tmp/tags.txt "$LATEST_TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit

      # APP_VERSION is baked into the bundle (see vite.config.ts).
      - name: Build
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      - name: Package
        run: |
          cd dist && zip -qr ../aurabeats-web.zip .
          ls -lh ../aurabeats-web.zip

      # --generate-notes lets GitHub build the release notes automatically
      # (What's Changed, New Contributors and Full Changelog), the same
      # notes the "Generate release notes" button creates in the UI.
      - name: Create release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          gh release create "$TAG" aurabeats-web.zip \
            --target "$GITHUB_SHA" \
            --title "AuraBeats — v$VERSION" \
            --generate-notes \
            --latest

      - name: Summary
        if: always()
        run: |
          {
            echo "### Website release"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Branch | \`$GITHUB_REF_NAME\` |"
            echo "| Version | \`v${{ steps.version.outputs.version }}\` |"
            echo "| Release | [${{ steps.version.outputs.tag }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
