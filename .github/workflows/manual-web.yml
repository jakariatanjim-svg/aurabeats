# Manual website build — the only pipeline that creates releases.
#
# Nothing runs automatically: every release is a deliberate "Run workflow".
# The branch dropdown at the top of the run dialog ("Use workflow from") is the
# build selector, and it decides what the run is allowed to do:
#
#   default branch (main) -> PRODUCTION. The next version is computed, a git
#                            tag + GitHub Release are created and the Cloudflare
#                            Pages bundle is attached as `aurabeats-web.zip`.
#   any other branch      -> TEST. Same build, same version label, but nothing
#                            is published: no tag, no release. The ZIP is
#                            uploaded as a run artifact so it can be inspected
#                            and only then released from the default branch.
#
# Version scheme (shared with manual-apk.yml): 1.0 -> 1.1 -> ... -> 1.9 -> 2.0
# -> 2.1 ... The number is derived from the highest existing `vX.Y` tag, so one
# run on the default branch produces exactly one new version. No dates, no run
# counters.
name: "Manual: Website Build"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override — leave empty for the next automatic version (1.0 → 1.1 → … → 1.9 → 2.0)"
        required: false
        default: ""
        type: string

# Serialized on purpose: two parallel runs would compute the same "next
# version" and race for the same tag. Queued runs simply wait.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  web:
    name: Website build (${{ github.ref_name }})
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # main (or whatever the repo's default branch is) -> publish a release.
      # Anything else -> artifact only.
      - name: Resolve build mode
        id: mode
        run: |
          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          BRANCH="$GITHUB_REF_NAME"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            MODE="release"
          else
            MODE="artifact"
          fi
          {
            echo "default_branch=$DEFAULT_BRANCH"
            echo "branch=$BRANCH"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"
          echo "Branch '$BRANCH' (default '$DEFAULT_BRANCH') -> mode: $MODE"

      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name' > /tmp/tags.txt || : > /tmp/tags.txt

          VERSION=$(python3 - /tmp/tags.txt <<'PY'
          import os, re, sys

          override = os.environ.get("VERSION_OVERRIDE", "").strip()

          if override:
              m = re.fullmatch(r"v?(\d+)\.(\d+)", override)
              if not m:
                  # Workflow commands are only parsed from stdout.
                  print("::error::Version override '%s' must look like 1.4 (MAJOR.MINOR)." % override)
                  raise SystemExit(1)
              print("%d.%d" % (int(m.group(1)), int(m.group(2))))
              raise SystemExit(0)

          # Highest existing vX.Y tag wins; minor only ever runs 0-9, so 1.9
          # rolls over to 2.0. Unrelated tags (legacy date stamps) are ignored.
          highest = None
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  m = re.fullmatch(r"v?(\d+)\.(\d)", line.strip())
                  if not m:
                      continue
                  pair = (int(m.group(1)), int(m.group(2)))
                  if highest is None or pair > highest:
                      highest = pair

          if highest is None:
              print("1.0")
          elif highest[1] < 9:
              print("%d.%d" % (highest[0], highest[1] + 1))
          else:
              print("%d.0" % (highest[0] + 1))
          PY
          ) || exit 1

          if [ "${{ steps.mode.outputs.mode }}" = "release" ] && gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Leave the override empty to auto-advance, or pick a free version."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Version for this run: v$VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit

      # APP_VERSION is baked into the bundle (see vite.config.ts) so the app can
      # tell which release it came from.
      - name: Build web bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      # One artifact only: the dist/ ZIP that gets uploaded to Cloudflare Pages.
      - name: Package dist
        run: |
          cd dist && zip -r ../aurabeats-web.zip . && cd ..
          ls -lh aurabeats-web.zip

      # ---------------- production: publish the release ----------------
      - name: Create release + tag
        if: steps.mode.outputs.mode == 'release'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILT_AT="$(date -u '+%Y-%m-%d %H:%M UTC')"

          NOTES=$(cat <<EOF
          AuraBeats v$VERSION

          - Website bundle: built from \`$SHORT_SHA\` on $BUILT_AT
          - \`aurabeats-web.zip\` holds the \`dist/\` output — unzip it and upload the contents to Cloudflare Pages.
          - Android: run **Manual: APK Build** on the default branch to attach \`AuraBeats.apk\` (stamped v$VERSION) to this release.
          EOF
          )

          gh release create "$TAG" aurabeats-web.zip \
            --target "$GITHUB_SHA" \
            --title "AuraBeats — v$VERSION" \
            --notes "$NOTES" \
            --latest
          echo "Published $TAG"

      # ---------------- test branch: artifact only ----------------
      # Branch names may contain characters that are invalid in artifact names
      # (slash, colon, ...), so derive a safe label first.
      - name: Prepare artifact label
        if: steps.mode.outputs.mode == 'artifact'
        id: label
        run: |
          SAFE_REF=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          {
            echo "ref=$SAFE_REF"
            echo "sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload test artifact
        if: steps.mode.outputs.mode == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: aurabeats-web-${{ steps.label.outputs.ref }}-${{ steps.label.outputs.sha }}-v${{ steps.version.outputs.version }}
          path: aurabeats-web.zip
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### AuraBeats website build"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Branch | \`$GITHUB_REF_NAME\` |"
            echo "| Mode | \`${{ steps.mode.outputs.mode }}\` |"
            echo "| Version | \`v${{ steps.version.outputs.version }}\` |"
            if [ "${{ steps.mode.outputs.mode }}" = "release" ]; then
              echo "| Published | [${{ steps.version.outputs.tag }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}) |"
            else
              echo "| Published | nothing — test branch, download the ZIP from **Artifacts** |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
