name: "Probe — sound/ad behaviour (temporary)"
on:
  push:
    paths: [".github/probe/**"]
jobs:
  ad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: |
          cd .github/probe && npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: nohup python3 .github/probe/spa.py dist 4173 > /tmp/spa.log 2>&1 &
      - run: sleep 2 && curl -s -o /dev/null -w "%{http_code}\n" http://localhost:4173/watch/x
      - name: Probe
        working-directory: .github/probe
        env: { IDS: "kJQP7kiw5Fk,JGwWNGJdvx8,RgKAFK5djSk" }
        run: node adprobe.mjs
