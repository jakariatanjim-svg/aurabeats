name: "Probe — APK compile (temporary)"
on:
  push:
    paths: [".github/probe/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: |
          npx cap add android
          npx cap sync android
      - name: Add native plugins
        run: |
          PKG_DIR=android/app/src/main/java/dev/pages/aurabeats
          test -f "$PKG_DIR/MainActivity.java" || { echo "::error::MainActivity.java not found in $PKG_DIR"; exit 1; }
          cp native/android/*.java "$PKG_DIR/"
          ls -l "$PKG_DIR"
          python3 - <<'PY'
          import pathlib

          path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          perms = [
              '<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
          ]
          add = "".join("    " + p + "\n" for p in perms if p.split('"')[1] not in text)
          if add:
              text = text.replace("</manifest>", add + "</manifest>", 1)
              path.write_text(text)
          print("Declared:", add or "already present")
          PY

      - name: Show manifest permissions
        run: grep -n "uses-permission" android/app/src/main/AndroidManifest.xml | while read -r l; do echo "::warning::$l"; done
      - name: Resolve Kotlin stdlib conflict
        run: |
          cat >> android/build.gradle << 'G'

          subprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          G
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log
          ls -lh app/build/outputs/apk/debug/
      - name: Report
        if: always()
        run: |
          grep -E "error:|warning: \[|BUILD (SUCCESSFUL|FAILED)" /tmp/gradle.log | head -40 | while read -r l; do echo "::warning::$l"; done
