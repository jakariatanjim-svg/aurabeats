# TEMPORARY compile check for native/android changes — removed before merge.
name: "Probe — APK compile"
on:
  push:
    paths: [".github/probe/**"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_APK: "1"
      - run: |
          npx cap add android
          npx cap sync android
          grep -rn "screen-orientation" android/capacitor.settings.gradle android/app/capacitor.build.gradle
      - name: Add native plugins
        run: |
          PKG_DIR=android/app/src/main/java/dev/pages/aurabeats
          test -f "$PKG_DIR/MainActivity.java" || { echo "::error::MainActivity.java not found in $PKG_DIR"; exit 1; }
          cp native/android/*.java "$PKG_DIR/"
          ls -l "$PKG_DIR"
          python3 - <<'PY'
          import pathlib

          path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          perms = [
              '<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              # Android 7-10: downloads into Download/AuraBeats by path (asked at runtime).
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />',
          ]
          add = "".join("    " + p + "\n" for p in perms if p.split('"')[1] not in text)
          if add:
              text = text.replace("</manifest>", add + "</manifest>", 1)
              path.write_text(text)
          # Android 10: lets the by-path fallback write to Download/ (ignored on 11+).
          if "requestLegacyExternalStorage" not in text:
              text = text.replace("<application", '<application android:requestLegacyExternalStorage="true"', 1)
              path.write_text(text)
          print("Declared:", add or "already present")
          PY
      - run: grep -n "WRITE_EXTERNAL_STORAGE\|requestLegacyExternalStorage" android/app/src/main/AndroidManifest.xml
      - run: cd android && ./gradlew assembleDebug --no-daemon -q
