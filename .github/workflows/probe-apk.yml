# TEMPORARY compile check for native/android changes — removed before merge.
name: "Probe — APK compile"
on:
  push:
    paths: [".github/probe/**"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_APK: "1"
      - run: |
          npx cap add android
          npx cap sync android
          grep -rn "capacitor-app\|capacitor/app" android/capacitor.settings.gradle android/app/capacitor.build.gradle || true
      - run: cp native/android/*.java android/app/src/main/java/dev/pages/aurabeats/
      - run: cd android && ./gradlew assembleDebug --no-daemon -q
