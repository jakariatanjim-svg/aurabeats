name: zz-video-probe (temporary)
on:
  push:
    branches: [arena/1784188a-aurabeats]
    paths: [".github/probe/**", ".github/workflows/zz-video-probe.yml", "src/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
      - run: npm i --no-save playwright@1
        working-directory: .github/probe
      - run: node ui.mjs > out.txt 2>&1 || true
        working-directory: .github/probe
      - name: Text
        working-directory: .github/probe
        run: |
          python3 - <<'PY'
          t = open("out.txt").read()
          chunks = [t[i:i+3800] for i in range(0, len(t), 3800)][:10]
          for n, c in enumerate(chunks):
              c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title=part{n}::{c}")
          PY
      - name: Shots A
        working-directory: .github/probe
        run: |
          python3 - <<'PY'
          import json, os
          if os.path.exists("shots.json"):
            s = json.load(open("shots.json"))
            items = []
            for sh in s:
              b = sh["b64"]
              parts = [b[i:i+60000] for i in range(0, len(b), 60000)]
              for k, p in enumerate(parts):
                items.append((f"img|{sh['name']}|{k}|{len(parts)}", p))
            json.dump(items, open("items.json", "w"))
            for t, p in items[:10]:
              print(f"::notice title={t}::{p}")
          PY
      - name: Shots B
        working-directory: .github/probe
        run: |
          python3 - <<'PY'
          import json, os
          if os.path.exists("items.json"):
            for t, p in json.load(open("items.json"))[10:20]:
              print(f"::notice title={t}::{p}")
          PY
      - name: Shots C
        working-directory: .github/probe
        run: |
          python3 - <<'PY'
          import json, os
          if os.path.exists("items.json"):
            for t, p in json.load(open("items.json"))[20:30]:
              print(f"::notice title={t}::{p}")
          PY
