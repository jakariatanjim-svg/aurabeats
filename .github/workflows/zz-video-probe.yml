name: zz-video-probe (temporary)
on:
  push:
    branches: [arena/1784188a-aurabeats]
    paths: [".github/probe/**", ".github/workflows/zz-video-probe.yml", "src/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
      - run: npm i --no-save playwright@1
        working-directory: .github/probe
      - run: node ui.mjs > out.txt 2>&1 || true
        working-directory: .github/probe
      - name: Text
        working-directory: .github/probe
        run: |
          python3 - <<'PY'
          t = open("out.txt").read()
          chunks = [t[i:i+3800] for i in range(0, len(t), 3800)][:10]
          for n, c in enumerate(chunks):
              c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title=part{n}::{c}")
          PY
      - name: Shots
        working-directory: .github/probe
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          if os.path.exists("shots.json"):
            for sh in json.load(open("shots.json")):
              open("b.json","w").write(json.dumps({"content": sh["b64"], "encoding": "base64"}))
              r = subprocess.run(["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs","--input","b.json","-q",".sha"],capture_output=True,text=True)
              print(f"::notice title=blob|{sh['name']}::{r.stdout.strip()} {r.stderr.strip()[:200]}")
          PY
