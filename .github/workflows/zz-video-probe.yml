name: zz-video-probe (temporary)
on:
  push:
    branches: [arena/1784188a-aurabeats]
    paths: [".github/probe/**", ".github/workflows/zz-video-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tools
        working-directory: .github/probe
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
          url=$(gh api repos/uBlockOrigin/uBOL-home/releases/latest -q '.assets[] | select(.name | test("chromium")) | .browser_download_url' | head -1)
          echo "uBOL: $url"; curl -sL "$url" -o ubol.zip; mkdir ubol; unzip -q ubol.zip -d ubol; ls ubol | head
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update -qq && sudo apt-get install -y -qq brave-browser > /dev/null && brave-browser --version
      - run: (xvfb-run -a node run.mjs > out.txt 2>&1 || true); head -c 300 out.txt
        working-directory: .github/probe
      - name: Text
        working-directory: .github/probe
        run: |
          python3 - <<'PY'
          t = open("out.txt").read()
          for n, c in enumerate([t[i:i+3800] for i in range(0, len(t), 3800)][:10]):
              print(f"::notice title=part{n}::" + c.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
