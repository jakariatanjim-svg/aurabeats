name: zz-sync-probe
on:
  push:
    branches: [arena/5cc9a89b-aurabeats]
    paths: [".github/probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd .github/probe && timeout 150 node run.mjs 2>&1 | tee out.txt
      - run: cut -c1-200 .github/probe/out.txt | paste -sd'|' | sed 's/^/::notice::/'
