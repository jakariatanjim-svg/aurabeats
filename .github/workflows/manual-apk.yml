# APK release pipeline. Builds and signs the Android package, stamps it with the
# version of the release marked "latest", and uploads it into that release.
# No tag, no release and no version is created here.
#
# Stamping the latest release's version is what keeps the in-app updater correct:
# the app compares its own baked-in version with the release version and offers a
# download only when the release is strictly newer.
name: "APK — Release"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Upload from a non-default branch — required only when such a branch is selected"
        required: false
        default: false
        type: boolean

# Parallel runs would upload over each other.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: APK release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check branch
        env:
          CONFIRMED: ${{ inputs.confirm }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "Default branch selected: $GITHUB_REF_NAME"
            exit 0
          fi
          if [ "$CONFIRMED" != "true" ]; then
            echo "::error::$GITHUB_REF_NAME is not the default branch ($DEFAULT_BRANCH), and this workflow uploads an APK into the latest release. Re-run it with \"Upload from a non-default branch\" enabled to continue, or use \"APK — Test Build\" for an artifact-only build."
            exit 1
          fi
          echo "::warning::Uploading to the latest release from $GITHUB_REF_NAME. The default branch is $DEFAULT_BRANCH."

      - uses: actions/checkout@v4

      # The release marked "latest" is the target — the same endpoint the app
      # queries (/releases/latest), so build and client always agree.
      - name: Resolve target release
        id: target
        run: |
          LATEST_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No release exists yet. Run \"Website — Release\" first; this workflow only attaches an APK to an existing release."
            exit 1
          fi

          VERSION=$(printf '%s' "$LATEST_TAG" | python3 -c 'import re,sys; m=re.fullmatch(r"v?(\d+)\.(\d+)", sys.stdin.read().strip()); print("%d.%d" % (int(m.group(1)), int(m.group(2))) if m else "")') || exit 1
          if [ -z "$VERSION" ]; then
            echo "::error::Latest release tag '$LATEST_TAG' carries no MAJOR.MINOR version. Publish a versioned release with \"Website — Release\" first."
            exit 1
          fi

          {
            echo "tag=$LATEST_TAG"
            echo "version=$VERSION"
            echo "asset=AuraBeats-$VERSION.apk"
          } >> "$GITHUB_OUTPUT"
          echo "Target release: $LATEST_TAG (version $VERSION)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npx tsc --noEmit

      # The bundle inside the APK must know its own version; the updater compares
      # it against the latest release.
      - name: Build
        env:
          APP_VERSION: ${{ steps.target.outputs.version }}
          # Bundles the app-only YouTube TV fallback (youtubei.js); the website build leaves it out.
          VITE_APK: "1"
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      # Native plugins (native/android): VideoSaver = in-app video / song
      # downloads (joins YouTube's picture + sound with Android's MediaMuxer),
      # DeviceMusic = songs already on the phone. MainActivity registers them.
      - name: Add native plugins
        run: |
          PKG_DIR=android/app/src/main/java/dev/pages/aurabeats
          test -f "$PKG_DIR/MainActivity.java" || { echo "::error::MainActivity.java not found in $PKG_DIR"; exit 1; }
          cp native/android/*.java "$PKG_DIR/"
          ls -l "$PKG_DIR"
          python3 - <<'PY'
          import pathlib

          path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          perms = [
              '<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              # Android 7-10: downloads into Download/AuraBeats by path (asked at runtime).
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />',
              # Device sync: scan the QR code (asked only when Scan is tapped).
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-feature android:name="android.hardware.camera" android:required="false" />',
          ]
          add = "".join("    " + p + "\n" for p in perms if p.split('"')[1] not in text)
          if add:
              text = text.replace("</manifest>", add + "</manifest>", 1)
              path.write_text(text)
          # Android 10: lets the by-path fallback write to Download/ (ignored on 11+).
          if "requestLegacyExternalStorage" not in text:
              text = text.replace("<application", '<application android:requestLegacyExternalStorage="true"', 1)
              path.write_text(text)
          print("Declared:", add or "already present")
          PY

      - name: Set app icon
        run: |
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp public/icon-512.png "android/app/src/main/res/${dir}/ic_launcher.png" 2>/dev/null || true
            cp public/icon-512.png "android/app/src/main/res/${dir}/ic_launcher_round.png" 2>/dev/null || true
            cp public/icon-512.png "android/app/src/main/res/${dir}/ic_launcher_foreground.png" 2>/dev/null || true
          done

      # versionCode must strictly increase or Android refuses the APK as a
      # downgrade. major*10 + minor tracks 1.0 -> 1.9 -> 2.0 as 10 -> 19 -> 20.
      - name: Stamp APK version
        id: stamp
        run: |
          VERSION="${{ steps.target.outputs.version }}"
          VERSION_CODE=$(python3 -c "
          major, minor = [int(p) for p in '$VERSION'.split('.')[:2]]
          print(major * 10 + minor)
          ") || exit 1

          python3 - "$VERSION" "$VERSION_CODE" <<'PY'
          import pathlib, re, sys

          version, code = sys.argv[1], sys.argv[2]
          path = pathlib.Path("android/app/build.gradle")
          text = path.read_text()
          text, hits_code = re.subn(r"versionCode\s+\d+", "versionCode %s" % code, text, count=1)
          text, hits_name = re.subn(r'versionName\s+"[^"]*"', 'versionName "%s"' % version, text, count=1)
          if hits_code != 1 or hits_name != 1:
              print("::error::Could not patch versionCode/versionName in %s" % path)
              raise SystemExit(1)
          path.write_text(text)
          print("versionName %s / versionCode %s" % (version, code))
          PY

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # Without this permission the installer intent fails on Android 8+.
      - name: Allow in-app APK install
        run: |
          python3 - <<'PY'
          import pathlib

          path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          if "REQUEST_INSTALL_PACKAGES" in text:
              print("REQUEST_INSTALL_PACKAGES already declared")
              raise SystemExit(0)

          permission = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          anchor = '<uses-permission android:name="android.permission.INTERNET" />'
          if anchor in text:
              text = text.replace(anchor, anchor + "\n    " + permission, 1)
          else:
              text = text.replace("</manifest>", "    " + permission + "\n</manifest>", 1)
          path.write_text(text)
          print("Declared REQUEST_INSTALL_PACKAGES")
          PY

      # The permanent signing key lives only in GitHub Secrets. A fresh runner
      # has no debug keystore, so without it Gradle would invent a new signing
      # identity per run and updates could never install over the old app.
      # Secrets: ANDROID_KEYSTORE_BASE64 (the keystore file, base64),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Sign with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=""
          [ -n "$KEYSTORE_BASE64" ] || MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || MISSING="$MISSING ANDROID_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Signing secrets are missing: ${MISSING# }. Add them in Settings → Secrets and variables → Actions → New repository secret. A release APK must be signed with the permanent key, otherwise it can't update the installed app."
            exit 1
          fi

          # Outside the workspace, so the key can never end up in an artifact.
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KEYSTORE_FILE" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Paste the whole base64 text of the keystore file, nothing else."
            exit 1
          }
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened with ANDROID_KEYSTORE_PASSWORD, or it has no key named ANDROID_KEY_ALIAS. Check those two secrets."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          # Gradle reads the values from the environment of the build step.
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  stable {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.stable }
                  release { signingConfig signingConfigs.stable }
              }
          }
          EOF
          echo "Signing with the release key from GitHub Secrets"

      - name: Resolve Kotlin stdlib conflict
        run: |
          cat >> android/build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "${{ steps.target.outputs.asset }}"
          ls -lh "${{ steps.target.outputs.asset }}"

      # Shows the certificate in the log. It must stay identical from release to
      # release, the precondition for an in-place update.
      - name: Record signing identity
        run: |
          keytool -printcert -jarfile "${{ steps.target.outputs.asset }}" 2>/dev/null | grep -Ei "^Owner|SHA256:" | head -4

      - name: Upload APK to release
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          ASSET="${{ steps.target.outputs.asset }}"

          # Keep exactly one Android package per release, including any asset
          # left behind by an earlier naming scheme.
          gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -Ei '^AuraBeats.*\.apk$' \
            | grep -vxF "$ASSET" \
            | while read -r old; do
                gh release delete-asset "$TAG" "$old" --yes || true
              done

          gh release upload "$TAG" "$ASSET" --clobber

      - name: Summary
        if: always()
        run: |
          {
            echo "### APK release"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Branch | \`$GITHUB_REF_NAME\` |"
            echo "| Version | \`v${{ steps.target.outputs.version }}\` (versionCode ${{ steps.stamp.outputs.version_code }}) |"
            echo "| Uploaded to | [${{ steps.target.outputs.tag }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.target.outputs.tag }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
