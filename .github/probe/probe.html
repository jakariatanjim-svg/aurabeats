<!doctype html><html><head><meta charset="utf-8"><title>probe</title></head><body><p>probe</p>
<script>
// === same logic as src/components/video/adblock.ts ===
const PROBES = [
  { url: "https://static.doubleclick.net/instream/ad_status.js", method: "GET" },
  { url: "https://www.youtube.com/api/stats/ads?ver=2", method: "GET" },
  { url: "https://www.youtube.com/pagead/paralleladview", method: "GET" },
  { url: "https://googleads.g.doubleclick.net/pagead/id", method: "GET" },
  { url: "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js", method: "HEAD" },
  { url: "https://imasdk.googleapis.com/js/sdkloader/ima3.js", method: "HEAD" },
];
const CONTROL = "https://i.ytimg.com/vi/dQw4w9WgXcQ/default.jpg";
const bust = (u) => u + (u.includes("?") ? "&" : "?") + "_=" + Date.now() + Math.random().toString(36).slice(2, 6);
async function tryOne(url, method) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 7000);
  try {
    const r = await fetch(bust(url), { method, mode: "no-cors", cache: "no-store", credentials: "omit", signal: ctl.signal });
    // Cross-origin no-cors answers are always "opaque"; anything else means a
    // blocker swapped in its own stand-in file (uBO / uBO Lite / Brave redirects).
    const swapped = r.type !== "opaque" || /^(chrome|moz|safari-web)-extension:|^data:/.test(r.url);
    return swapped ? "swapped:" + r.type : "ok";
  } catch (e) {
    return ctl.signal.aborted ? "timeout" : "blocked";
  } finally { clearTimeout(t); }
}
window.runProbe = async () => {
  const [control, ...res] = await Promise.all([tryOne(CONTROL, "GET"), ...PROBES.map((p) => tryOne(p.url, p.method))]);
  const hits = res.filter((r) => r === "blocked" || r.startsWith("swapped")).length;
  return { brave: !!navigator.brave, ua: navigator.userAgent.slice(0, 70), control, res: PROBES.map((p, i) => p.url.replace("https://", "").slice(0, 55).padEnd(56) + res[i]), verdict: control === "ok" && hits > 0 ? "BLOCKER ON" : control !== "ok" ? "unknown (offline)" : "no blocker", hits };
};
</script></body></html>
