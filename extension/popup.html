<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <header class="head">
        <span class="logo"><img src="icon-48.png" alt="" width="40" height="40" /></span>
        <div class="title">
          <strong>AuraBeats</strong>
          <span>Connector <em id="ver"></em></span>
        </div>
      </header>

      <section id="status" class="status" data-state="loading">
        <span class="dot"></span>
        <span id="status-text">Checking YouTube…</span>
      </section>

      <section id="accounts" class="accounts" aria-live="polite">
        <div class="acct skel"><i></i><b></b></div>
      </section>

      <nav class="actions">
        <a class="btn primary" href="https://aurabeats.pages.dev/settings" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" /></svg>
          Open AuraBeats
        </a>
        <a id="yt" class="btn ghost" href="https://www.youtube.com/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span id="yt-text">Add account</span>
        </a>
      </nav>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
