# Signing material for the AuraBeats Android APK.
#
# INTENTIONALLY PUBLIC. This is the distribution key for a side-loaded,
# open-source build — not a Play Store upload key and not a secret. It is
# committed on purpose so that every CI run signs with the SAME identity:
# without a stable signature Android refuses to install an update on top of the
# installed app (INSTALL_FAILED_UPDATE_INCOMPATIBLE) and the in-app updater
# could never work.
#
# Never reuse these credentials for anything that must stay private.
#
# The keystore is resolved relative to THIS file, so the pair can be moved
# together without touching the build.
storeFileName=aurabeats.keystore
storePassword=aurabeats
keyAlias=aurabeats
keyPassword=aurabeats
storeType=PKCS12
